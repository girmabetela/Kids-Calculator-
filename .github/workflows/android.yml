name: Build Kids Calculator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Install Capacitor Assets
        run: npm install -D @capacitor/assets

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Capacitor icon
        run: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png

      - name: Generate Android icons
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin duplicate classes
        working-directory: android
        run: |
          sed -i '/allprojects {/a\    configurations.all { resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" }' build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kids-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
